<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paperweight</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Paperweight">
<meta name="color-scheme" content="dark light" id="csMeta">
<meta name="theme-color" content="#0B0E13" id="tcMeta">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

:root{
  --bg:#0B0E13; --bg2:#0E1219; --panel:#121722; --panel2:#161C2A; --panel3:#1B2232;
  --line:#222B3C; --line-soft:#1A2130;
  --text:#E9E4D8; --dim:#98A1B0; --faint:#5D6673;
  --teal:#5FBFB2; --teal-bg:rgba(95,191,178,.12); --teal-line:rgba(95,191,178,.35);
  --gold:#D9A84E; --gold-bg:rgba(217,168,78,.12); --gold-line:rgba(217,168,78,.4);
  --red:#C96A5B; --red-bg:rgba(201,106,91,.13);
  --green:#84B871; --green-bg:rgba(132,184,113,.13);
  --body2:#C9CDD6; --work-ink:#BFC6D2; --glass:rgba(11,14,19,.85);
  --scroll:#242D3E; --line2:#33405A; --on-accent:#0B0E13;
  --hl:rgba(217,168,78,.30); --hl-strong:rgba(217,168,78,.48);
  --disp:'Fraunces', Georgia, 'Times New Roman', serif;
  --body:'Inter', -apple-system, 'SF Pro Text', 'Segoe UI', sans-serif;
  --mono:'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
  --r:12px; --r-sm:8px;
  --sidebar-w:300px;
}
[data-theme="light"]{
  --bg:#F5F3EC; --bg2:#EFECE2; --panel:#FCFBF6; --panel2:#F2EFE6; --panel3:#EAE6DA;
  --line:#DBD5C7; --line-soft:#E6E1D4;
  --text:#20242D; --dim:#59616F; --faint:#8B93A0;
  --teal:#177E72; --teal-bg:rgba(23,126,114,.09); --teal-line:rgba(23,126,114,.35);
  --gold:#A8770F; --gold-bg:rgba(168,119,15,.09); --gold-line:rgba(168,119,15,.4);
  --red:#B34A3A; --red-bg:rgba(179,74,58,.08);
  --green:#4E7C3F; --green-bg:rgba(78,124,63,.1);
  --body2:#3A4150; --work-ink:#2E3543; --glass:rgba(245,243,236,.9);
  --scroll:#D5CEBE; --line2:#C3BBA8; --on-accent:#F5F3EC;
  --hl:rgba(255,214,64,.55); --hl-strong:rgba(255,206,26,.78);
}
[data-theme="light"] .tab.on{box-shadow:0 1px 4px rgba(0,0,0,.08)}
[data-theme="light"] #pal,[data-theme="light"] #prt{box-shadow:0 24px 70px rgba(40,35,20,.25)}
*{box-sizing:border-box; margin:0; padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){ html{scroll-behavior:auto} *{transition:none!important; animation:none!important} }
body{
  background:var(--bg); color:var(--text);
  font-family:var(--body); font-size:15px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--teal-bg); color:var(--teal)}
::-webkit-scrollbar{width:9px; height:9px}
::-webkit-scrollbar-thumb{background:var(--scroll); border-radius:6px; border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
button{font-family:inherit; color:inherit; background:none; border:none; cursor:pointer}
input{font-family:inherit}

/* ── Topbar ─────────────────────────────────────── */
#topbar{
  position:fixed; top:0; left:0; right:0; height:56px; z-index:50;
  display:flex; align-items:center; gap:14px; padding:0 18px;
  background:var(--glass); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line-soft);
}
#brand{font-family:var(--disp); font-size:17px; font-weight:600; letter-spacing:.2px; white-space:nowrap}
#brand em{font-style:normal; color:inherit}
#subjTabs{display:flex; gap:4px; margin-left:10px; overflow-x:auto}
.subjTab{
  padding:6px 14px; border-radius:99px; font-size:13px; font-weight:500; color:var(--dim);
  border:1px solid transparent; white-space:nowrap; transition:all .15s;
}
.subjTab:hover{color:var(--text); background:var(--panel2)}
.subjTab.on{color:var(--teal); background:var(--teal-bg); border-color:var(--teal-line)}
#topRight{margin-left:auto; display:flex; align-items:center; gap:10px}
.topBtn{
  display:flex; align-items:center; gap:8px; padding:7px 13px;
  border:1px solid var(--line); border-radius:var(--r-sm);
  font-size:13px; color:var(--dim); transition:all .15s; white-space:nowrap;
}
.topBtn:hover{color:var(--text); border-color:var(--line2); background:var(--panel2)}
.topBtn kbd{
  font-family:var(--mono); font-size:10.5px; color:var(--faint);
  border:1px solid var(--line); border-radius:4px; padding:1px 5px;
}
#quizLaunch{color:var(--gold); border-color:var(--gold-line); background:var(--gold-bg); font-weight:600}
#quizLaunch:hover{background:rgba(217,168,78,.2); color:var(--gold); border-color:var(--gold)}

/* ── Layout ─────────────────────────────────────── */
#app{display:flex; padding-top:56px; min-height:100vh}
#sidebar{
  width:var(--sidebar-w); flex-shrink:0; position:fixed; top:56px; bottom:0; left:0;
  overflow-y:auto; padding:20px 14px 40px;
  background:var(--bg2); border-right:1px solid var(--line-soft);
  transition:transform .32s cubic-bezier(.22,1,.36,1);
}
#main{flex:1; margin-left:var(--sidebar-w); padding:34px 46px 120px; max-width:1060px;
  transition:margin-left .32s cubic-bezier(.22,1,.36,1)}
body.sideHid #sidebar{transform:translateX(-100%)}
body.sideHid #main{margin-left:0; max-width:none}

/* the handle rides on the sidebar's edge and moves with it */
#sideTog{
  position:fixed; top:50%; left:var(--sidebar-w); z-index:70;
  width:19px; height:62px; margin-top:-31px; margin-left:-1px;
  display:flex; align-items:center; justify-content:center;
  background:var(--panel2); color:var(--dim);
  border:1px solid var(--line); border-left:none;
  border-radius:0 8px 8px 0; font-size:11px; line-height:1;
  transition:left .32s cubic-bezier(.22,1,.36,1), background .2s, color .2s;
}
#sideTog:hover{background:var(--panel3); color:var(--text)}
body.sideHid #sideTog{left:0}
#sideScrim{
  position:fixed; inset:56px 0 0 0; z-index:55; background:rgba(0,0,0,.45);
  opacity:0; visibility:hidden; transition:opacity .25s, visibility .25s;
}
@media (prefers-reduced-motion:reduce){ #sidebar,#main,#sideTog{transition:none} }

/* ── Sidebar: the register ──────────────────────── */
.unitLbl{
  font-size:10.5px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
  color:var(--faint); padding:18px 10px 7px; display:flex; align-items:center; gap:8px;
}
.unitLbl::after{content:''; flex:1; height:1px; background:var(--line-soft)}
.chRow{
  width:100%; text-align:left; padding:9px 10px 8px; border-radius:var(--r-sm);
  display:block; transition:background .15s; border-left:2px solid transparent;
}
.chRow:hover{background:var(--panel)}
.chRow.on{background:var(--panel); border-left-color:var(--gold)}
.chRow .t{font-size:13.5px; font-weight:500; color:var(--dim); display:flex; justify-content:space-between; gap:8px; align-items:baseline}
.chRow.on .t{color:var(--text)}
.chRow .t .n{font-family:var(--mono); font-size:10.5px; color:var(--faint); flex-shrink:0}
.chBar{height:2px; margin-top:7px; background:var(--line-soft); border-radius:2px; overflow:hidden}
.chBar i{display:block; height:100%; background:var(--gold); border-radius:2px; transition:width .3s}
.chBar i.full{background:var(--teal)}
#sideFoot{margin-top:26px; padding:12px 10px; border-top:1px solid var(--line-soft); font-size:11.5px; color:var(--faint); line-height:1.7}

/* ── Chapter header ─────────────────────────────── */
.crumb{font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); margin-bottom:10px}
.crumb b{color:var(--teal); font-weight:500}
h1.chTitle{font-family:var(--disp); font-size:34px; font-weight:600; letter-spacing:.2px; line-height:1.2; margin-bottom:18px}
#chMeta{display:flex; align-items:center; gap:18px; margin-bottom:26px; flex-wrap:wrap}
#chProg{flex:1; min-width:200px; max-width:380px; height:4px; background:var(--panel2); border-radius:3px; overflow:hidden}
#chProg i{display:block; height:100%; background:linear-gradient(90deg,var(--gold),var(--teal)); border-radius:3px; transition:width .3s}
#chProgTxt{font-family:var(--mono); font-size:11.5px; color:var(--dim)}

/* ── Tabs ───────────────────────────────────────── */
#tabs{display:flex; gap:2px; background:var(--panel); border:1px solid var(--line-soft); border-radius:10px; padding:3px; width:max-content; margin-bottom:34px}
.tab{padding:7px 20px; border-radius:8px; font-size:13px; font-weight:500; color:var(--dim); transition:all .15s; display:flex; gap:8px; align-items:center}
.tab:hover{color:var(--text)}
.tab.on{background:var(--panel3); color:var(--text); box-shadow:0 1px 4px rgba(0,0,0,.3)}
.tab .ct{font-family:var(--mono); font-size:10px; color:var(--faint); background:var(--bg); padding:1px 6px; border-radius:99px}
.tab.on .ct{color:var(--gold)}

/* ── Lecture sections (Notes tab) ───────────────── */
.lecHead{
  display:flex; align-items:center; gap:14px; margin:44px 0 18px;
  padding-bottom:12px; border-bottom:1px solid var(--line-soft);
}
.lecHead:first-child{margin-top:0}
.lecNum{
  font-family:var(--mono); font-size:11px; color:var(--gold);
  border:1px solid var(--gold-line); background:var(--gold-bg);
  padding:3px 9px; border-radius:6px; letter-spacing:.05em; flex-shrink:0;
}
.lecTitle{font-family:var(--disp); font-size:20px; font-weight:600; flex:1}
.doneBtn{
  display:flex; align-items:center; gap:7px; font-size:12px; color:var(--faint);
  border:1px solid var(--line); padding:5px 12px; border-radius:99px; transition:all .15s; flex-shrink:0;
}
.doneBtn:hover{color:var(--text); border-color:var(--line2)}
.doneBtn.on{color:var(--green); border-color:rgba(132,184,113,.4); background:var(--green-bg)}
.doneBtn .dot{width:7px; height:7px; border-radius:50%; background:currentColor; opacity:.7}
.stepWrap{display:flex; gap:6px; flex-shrink:0; flex-wrap:wrap}
.stepBtn{padding:4px 11px; font-size:11.5px}
.lecHead.allDone .lecNum{color:var(--teal); border-color:var(--teal-line); background:var(--teal-bg)}

/* ── Cards ──────────────────────────────────────── */
.card{
  background:var(--panel); border:1px solid var(--line-soft); border-radius:var(--r);
  padding:22px 24px; margin-bottom:16px; position:relative;
}
.cardTop{display:flex; align-items:flex-start; gap:10px; margin-bottom:12px}
.cardTitle{font-size:15px; font-weight:600; color:var(--text); flex:1}
.starBtn{color:var(--faint); font-size:15px; line-height:1; padding:2px; transition:all .15s; flex-shrink:0}
.starBtn:hover{color:var(--gold)}
.starBtn.on{color:var(--gold)}
.cardBody{font-size:14.5px; color:var(--body2); line-height:1.75}
.cardBody p, .qAnsInner p, .qzAnsBox p{margin:0 0 13px}
.cardBody p:last-child, .qAnsInner p:last-child, .qzAnsBox p:last-child{margin-bottom:0}
.cardBody ul, .cardBody ol, .qAnsInner ul, .qAnsInner ol, .qzAnsBox ul, .qzAnsBox ol{margin:0 0 13px; padding-left:22px}
.cardBody li, .qAnsInner li, .qzAnsBox li{margin-bottom:5px}
.cardBody li:last-child, .qAnsInner li:last-child, .qzAnsBox li:last-child{margin-bottom:0}
.cardBody b, .cardBody strong, .qAnsInner b, .qAnsInner strong, .qzAnsBox b, .qzAnsBox strong{color:var(--text); font-weight:600}
.cardBody h3, .cardBody h4, .qAnsInner h3, .qAnsInner h4{margin:18px 0 8px; font-family:var(--disp); color:var(--text)}
.cardBody h3:first-child, .cardBody h4:first-child{margin-top:0}
.cardBody blockquote, .qAnsInner blockquote{margin:0 0 13px; padding-left:14px; border-left:2px solid var(--line2); color:var(--dim)}
.cardBody em, .qAnsInner em{color:var(--teal); font-style:normal}
.cardBody table{width:100%; border-collapse:collapse; margin:12px 0; font-size:13.5px}
.cardBody th{
  text-align:left; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--faint); font-weight:600; padding:8px 12px; border-bottom:1px solid var(--line);
}
.cardBody td{padding:9px 12px; border-bottom:1px solid var(--line-soft); vertical-align:top}
.cardBody tr:last-child td{border-bottom:none}
/* ── highlighter colours ── */
:root{
  --hc-y:#E9BE45; --hc-g:#7ED473; --hc-b:#6FB8FF;
  --hc-p:#F08FE0; --hc-o:#FF9D4D; --hc-r:#FF7C86;
}
[data-theme="light"]{
  --hc-y:#9A6B00; --hc-g:#2E7D32; --hc-b:#1565C0;
  --hc-p:#AD1457; --hc-o:#E65100; --hc-r:#C62828;
}
mark.hlm{
  background:none; padding:0; margin:0; border-radius:0;
  color:var(--hcc,var(--hc-y)); font-weight:650;
  cursor:pointer; transition:opacity .15s;
}
mark.hlm:hover{opacity:.65}

/* live trail while the pencil is moving — snug to the glyphs */
#hlGhost{position:fixed; inset:0; pointer-events:none; z-index:150; display:none}
body.hlmode #hlGhost{display:block}
#hlGhost i{position:fixed; border-radius:2px; background:var(--hcc-active,var(--hc-y)); opacity:.30}
mark.hlm[data-hc="y"]{--hcc:var(--hc-y)}
mark.hlm[data-hc="g"]{--hcc:var(--hc-g)}
mark.hlm[data-hc="b"]{--hcc:var(--hc-b)}
mark.hlm[data-hc="p"]{--hcc:var(--hc-p)}
mark.hlm[data-hc="o"]{--hcc:var(--hc-o)}
mark.hlm[data-hc="r"]{--hcc:var(--hc-r)}
mark.hlm:hover{filter:brightness(1.12) saturate(1.2)}

/* ── highlighter mode: the pencil draws, it doesn't select ── */
body.hlmode #main{cursor:crosshair; touch-action:pan-y;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
body.hlmode #hlBtn{background:var(--hcc-active,var(--hc-y)); border-color:transparent; color:var(--text)}

#hlBar{
  position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
  display:none; align-items:center; gap:9px; z-index:210;
  padding:9px 12px; border-radius:99px;
  background:var(--panel); border:1px solid var(--line);
  box-shadow:0 14px 44px rgba(0,0,0,.45);
}
body.hlmode #hlBar{display:flex; animation:riseIn .3s cubic-bezier(.22,1,.36,1)}
.hlSw{width:26px; height:26px; border-radius:50%; border:2px solid transparent; padding:0; flex:0 0 auto;
  transition:transform .16s cubic-bezier(.34,1.5,.5,1), border-color .16s}
.hlSw:active{transform:scale(.9)}
.hlSw.on{border-color:var(--text); transform:scale(1.14)}
.hlSw[data-c="y"]{background:var(--hc-y)} .hlSw[data-c="g"]{background:var(--hc-g)}
.hlSw[data-c="b"]{background:var(--hc-b)} .hlSw[data-c="p"]{background:var(--hc-p)}
.hlSw[data-c="o"]{background:var(--hc-o)} .hlSw[data-c="r"]{background:var(--hc-r)}
#hlBar .sep{width:1px; height:22px; background:var(--line); flex:0 0 auto}
#hlOff{font-size:12px; font-weight:600; color:var(--dim); padding:5px 10px; border-radius:99px; flex:0 0 auto}
#hlOff:hover{color:var(--text)}
.examChip{font-family:var(--mono); font-size:11px; padding:4px 12px; border-radius:99px; border:1px solid var(--gold-line); color:var(--gold); background:var(--gold-bg); font-weight:500}
.examChip.soon{color:var(--red); border-color:rgba(201,106,91,.45); background:var(--red-bg)}
.examSet{font-size:11.5px; color:var(--faint); text-decoration:underline; cursor:pointer}
.focusLine{font-size:13px; color:var(--dim); margin:-14px 0 26px}
.focusLine b{color:var(--teal); font-weight:600}
.weakSec{margin-bottom:30px}
.cardBody code{font-family:var(--mono); font-size:13px; color:var(--teal); background:var(--teal-bg); padding:1px 6px; border-radius:5px}
.cardBody .work{
  font-family:var(--mono); font-size:13px; background:var(--bg2);
  border:1px solid var(--line-soft); border-radius:var(--r-sm);
  padding:14px 16px; margin:12px 0; white-space:pre; overflow-x:auto; line-height:1.8; color:var(--work-ink);
}

/* ── Formula cards ──────────────────────────────── */
.fmCard{border-left:2px solid var(--teal)}
.fmRow{display:flex; gap:16px; padding:10px 0; border-bottom:1px solid var(--line-soft); align-items:baseline}
.fmRow:last-child{border-bottom:none}
.fmLbl{font-size:13px; color:var(--dim); width:38%; flex-shrink:0}
.fmVal{font-family:var(--mono); font-size:13.5px; color:var(--teal); flex:1; white-space:pre-wrap}
.fmNote{font-size:11.5px; color:var(--faint); width:20%; flex-shrink:0; text-align:right}

/* ── Question cards (Questions tab) ─────────────── */
.qCard{
  background:var(--panel); border:1px solid var(--line-soft); border-radius:var(--r);
  margin-bottom:14px; overflow:hidden;
}
.qHead{width:100%; text-align:left; padding:18px 22px; display:flex; gap:14px; align-items:flex-start; transition:background .15s}
.qHead:hover{background:var(--panel2)}
.qNum{font-family:var(--mono); font-size:11px; color:var(--gold); flex-shrink:0; padding-top:3px}
.qText{flex:1; font-size:14.5px; color:var(--text); line-height:1.6}
.qTags{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap}
.qTag{font-family:var(--mono); font-size:10px; color:var(--faint); border:1px solid var(--line); padding:2px 8px; border-radius:99px; letter-spacing:.03em}
.qTag.src{color:var(--teal); border-color:var(--teal-line)}
.qmark{font-family:var(--mono); font-size:10px; padding:1px 7px; border-radius:5px; flex-shrink:0; letter-spacing:.02em}
.qmark.m-right{color:var(--green); background:var(--green-bg)}
.qmark.m-partial{color:var(--gold); background:var(--gold-bg)}
.qmark.m-wrong{color:var(--red); background:var(--red-bg)}
.qChev{color:var(--faint); font-size:12px; transition:transform .2s; padding-top:4px}
.qCard.open .qChev{transform:rotate(90deg)}
.qAns{display:none; padding:0 22px 20px 22px}
.qCard.open .qAns{display:block}
.qAnsInner{border-top:1px dashed var(--line); padding-top:16px; font-size:14px; color:var(--body2); line-height:1.75}
.qAnsInner .work{font-family:var(--mono); font-size:13px; background:var(--bg2); border:1px solid var(--line-soft); border-radius:var(--r-sm); padding:14px 16px; margin:10px 0; white-space:pre; overflow-x:auto; line-height:1.8}

/* ── Empty states ───────────────────────────────── */
.empty{padding:60px 20px; text-align:center; color:var(--faint); font-size:14px}
.empty .big{font-family:var(--disp); font-size:20px; color:var(--dim); margin-bottom:8px}

/* ── Command palette ────────────────────────────── */
#palWrap{position:fixed; inset:0; z-index:100; display:none; background:rgba(5,7,10,.6); backdrop-filter:blur(3px)}
#palWrap.show{display:flex; align-items:flex-start; justify-content:center; padding-top:14vh}
#pal{width:620px; max-width:92vw; background:var(--panel2); border:1px solid var(--line); border-radius:14px; overflow:hidden; box-shadow:0 24px 70px rgba(0,0,0,.55)}
#palInput{width:100%; padding:17px 20px; background:transparent; border:none; outline:none; color:var(--text); font-size:15px; border-bottom:1px solid var(--line-soft)}
#palInput::placeholder{color:var(--faint)}
#palResults{max-height:46vh; overflow-y:auto; padding:6px}
.palItem{width:100%; text-align:left; padding:10px 14px; border-radius:8px; display:flex; gap:12px; align-items:center}
.palItem.sel{background:var(--panel3)}
.palKind{font-family:var(--mono); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; padding:2px 7px; border-radius:5px; flex-shrink:0; color:var(--faint); border:1px solid var(--line)}
.palKind.k-lec{color:var(--gold); border-color:var(--gold-line)}
.palKind.k-q{color:var(--teal); border-color:var(--teal-line)}
.palKind.k-fm{color:var(--green); border-color:rgba(132,184,113,.4)}
.palT{font-size:13.5px; color:var(--text); flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.palPath{font-size:11px; color:var(--faint); white-space:nowrap}

/* ── Quiz overlay ───────────────────────────────── */
#quizWrap{position:fixed; inset:0; z-index:90; display:none; background:var(--bg); overflow-y:auto}
#quizWrap.show{display:block}
#quizInner{max-width:760px; margin:0 auto; padding:40px 24px 80px}
#quizClose{position:fixed; top:18px; right:22px; font-size:13px; color:var(--faint); border:1px solid var(--line); padding:7px 14px; border-radius:99px; z-index:95}

/* home-screen icon — drawn at runtime, redraws on theme change */
(function(){
  function rrect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.quadraticCurveTo(x+w,y,x+w,y+r);
    g.lineTo(x+w,y+h-r);g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);g.lineTo(x+r,y+h);g.quadraticCurveTo(x,y+h,x,y+h-r);
    g.lineTo(x,y+r);g.quadraticCurveTo(x,y,x+r,y);g.closePath();}
  function draw(size,light){
    var c=document.createElement('canvas');c.width=size;c.height=size;
    var g=c.getContext('2d'); if(!g||!g.moveTo)return '';
    var bg='#EDE9E1', ink='#15181F';                   /* fixed: light ground, dark mark */
    g.fillStyle=bg; rrect(g,0,0,size,size,size*0.22); g.fill();
    var cx=size*0.5, sheetH=size*0.042, gap=size*0.058, baseY=size*0.735;
    var widths=[0.50,0.46,0.53,0.47];                  /* the stack, slightly ragged */
    g.fillStyle=ink;
    for(var i=0;i<4;i++){
      var w=size*widths[i], y=baseY-i*gap;
      var off=(i%2?-1:1)*size*0.014;
      rrect(g,cx-w/2+off,y,w,sheetH,sheetH*0.45); g.fill();
    }
    var topY=baseY-3*gap, r=size*0.125, wy=topY-r*0.06;
    g.beginPath(); g.arc(cx,wy,r,Math.PI,0); g.closePath(); g.fill();
    rrect(g,cx-r,wy-size*0.004,r*2,size*0.03,size*0.012); g.fill();
    return c.toDataURL('image/png');
  }
  function setIcons(){
    try{
      var light=document.documentElement.dataset.theme==='light';
      var t=document.querySelector('link[rel="apple-touch-icon"]')||document.createElement('link');
      t.rel='apple-touch-icon'; t.href=draw(180,light); if(!t.parentNode)document.head.appendChild(t);
      var f=document.querySelector('link[rel="icon"]')||document.createElement('link');
      f.rel='icon'; f.href=draw(64,light); if(!f.parentNode)document.head.appendChild(f);
    }catch(e){}
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setIcons); else setIcons();
  window.addEventListener('themechange',setIcons);
})();
</script>

  opacity:.55; transform:translateX(-50%);
  transition:bottom .5s cubic-bezier(.22,1,.36,1), opacity .4s}
.pwSheets i.fresh{animation:sheetIn .55s cubic-bezier(.22,1,.36,1)}
@keyframes sheetIn{
  0%{opacity:0; transform:translateX(46px) rotate(9deg)}
  100%{opacity:.55; transform:translateX(-50%) rotate(0)}
}
.pwWeight{position:absolute; left:50%; width:30px; height:15px; margin-left:-15px;
  border-radius:15px 15px 3px 3px; background:var(--teal); opacity:.85;
  transition:bottom .55s cubic-bezier(.34,1.5,.5,1)}
.pwWeight::after{content:''; position:absolute; left:6px; top:4px; width:6px; height:3px;
  border-radius:50%; background:var(--gold); opacity:.8}
.pwWeight.thud{animation:thud .5s cubic-bezier(.3,1.4,.5,1)}
@keyframes thud{0%{transform:translateY(-7px) scaleY(1.1)}55%{transform:translateY(1px) scaleY(.88)}100%{transform:none}}

.setBlk{margin:26px 0 0; max-width:640px}
.setLine{display:flex; align-items:center; gap:16px; padding:13px 0; border-bottom:1px solid var(--line-soft); font-size:14.5px}
.setLine:last-child{border-bottom:none}
.setLine > span:first-child{flex:1; min-width:0}
.setLine em{display:block; font-style:normal; font-size:11.5px; color:var(--faint); margin-top:2px; line-height:1.45}
.setNote{font-size:12.5px; color:var(--faint); margin:8px 0}
.setMini{font-size:11.5px; letter-spacing:.04em; border:1px solid var(--line2); border-radius:4px; padding:6px 12px; color:var(--dim); flex:0 0 auto}
.setMini.danger{border-color:var(--red); color:var(--red)}
.setSeg{display:flex; border:1px solid var(--line2); border-radius:4px; overflow:hidden; flex:0 0 auto}
.setSeg button{font-size:11.5px; padding:6px 13px; color:var(--dim)}
.setSeg button.on{background:var(--text); color:var(--bg)}
.hl{outline:1px solid var(--gold)!important; box-shadow:0 0 0 4px var(--gold-bg)!important; transition:box-shadow .4s}
#toastBox{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);background:var(--panel3);color:var(--text);border:1px solid var(--line);padding:11px 18px;border-radius:10px;font-size:13px;line-height:1.45;box-shadow:0 14px 44px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:9999;max-width:82vw;text-align:center}
#toastBox.on{opacity:1;transform:translateX(-50%) translateY(0)}
.impChap{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--faint);margin-top:5px;line-height:1.3}
.impChap b{color:var(--dim);font-weight:500}
.impChap button{color:var(--red);font-size:12px;line-height:1;padding:2px 4px}</style>
<script>
/* ═══════════ ENGINE — never edited when adding chapters ═══════════ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* persistence (works when opened locally; silently in-memory otherwise) */
let state={done:{},stars:{},quiz:{},exams:{},hl:{},content:[],view:null,sideHid:false,hlmode:false,hlColor:'y'};
try{ state=Object.assign(state, JSON.parse(localStorage.getItem('sem5v2')||'{}')); }catch(e){}
if(state.theme!=='light'&&state.theme!=='dark'&&state.theme!=='auto') state.theme='auto';
document.documentElement.dataset.theme=(function(){
  try{ if(state.theme==='auto') return (window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'; }catch(e){}
  return state.theme==='light'?'light':'dark';
})();
Object.keys(state.done).forEach(k=>{ if(state.done[k]===true) state.done[k]={l:1,n:1,q:1}; });
/* merge subjects added via the + button */
(state.subs||[]).forEach(s=>{
  if(!DATA.subjects.some(d=>d.name.toLowerCase()===s.name.toLowerCase()))
    DATA.subjects.push({id:s.id, code:s.code, name:s.name, units:[{name:'Unit 1', chapters:[]}]});
});

/* ══ imported chapter content ══════════════════════════════════════
   A chapter JSON looks like:
     { "subject":"s1", "unit":"Unit 1",
       "chapter":{ "id":"s1c2", "name":"Cost Sheets", "lectures":[ … ] } }
   Several at once:  { "chapters":[ {…}, {…} ] }
   Subject matches by id, code or name. Unknown unit is created.
   Same chapter id  → replaced (an update). New id → appended.
   ════════════════════════════════════════════════════════════════ */
function chapEntries(d){
  if(!d) return [];
  if(Array.isArray(d)) return d;
  if(Array.isArray(d.chapters)) return d.chapters;
  if(d.chapter || Array.isArray(d.lectures)) return [d];
  return [];
}
function entryChapter(en){ return en && (en.chapter || (Array.isArray(en.lectures)?en:null)); }
function entryChapId(en){ const c=entryChapter(en); return c&&c.id; }
function mergeChapterEntry(en){
  const chap=entryChapter(en);
  if(!chap || !Array.isArray(chap.lectures)) return null;
  const key=String(en.subject||en.sub||chap.subject||'').trim().toLowerCase();
  let sub=DATA.subjects.find(x=>String(x.id).toLowerCase()===key)
       || DATA.subjects.find(x=>String(x.name).toLowerCase()===key)
       || DATA.subjects.find(x=>String(x.code||'').toLowerCase()===key)
       || DATA.subjects[0];
  if(!sub) return null;
  const uname=String(en.unit||chap.unit||'Unit 1');
  let unit=sub.units.find(u=>String(u.name).toLowerCase()===uname.toLowerCase());
  if(!unit){ unit={name:uname, chapters:[]}; sub.units.push(unit); }
  if(!chap.id) chap.id=sub.id+'c'+Math.random().toString(36).slice(2,7);
  /* deep copy: the renderer decorates chapters with back-references (ch.sub, lec.ch,
     card.lec). Sharing objects with state.content would make the saved JSON circular
     and every later save would fail. */
  let clean;
  try{ clean=JSON.parse(JSON.stringify({id:chap.id, name:chap.name||'Untitled chapter', lectures:chap.lectures})); }
  catch(e){ return null; }
  const ix=unit.chapters.findIndex(c=>c.id===clean.id);
  const updated=ix>-1;
  if(updated) unit.chapters[ix]=clean; else unit.chapters.push(clean);
  return {subject:sub.name, unit:unit.name, name:clean.name, id:clean.id, updated};
}
/* replay everything imported so far, before the page indexes itself */
(state.content||[]).forEach(en=>{ try{ mergeChapterEntry(en); }catch(e){} });

function save(){ try{ localStorage.setItem('sem5v2', JSON.stringify({done:state.done,stars:state.stars,quiz:state.quiz,exams:state.exams,hl:state.hl,view:state.view,theme:state.theme,subs:state.subs||[],content:state.content||[],sideHid:!!state.sideHid,hlmode:!!state.hlmode,hlColor:state.hlColor||'y'})); return true; }catch(e){ return false; } }
function toast(msg,ms){
  let el=document.getElementById('toastBox');
  if(!el){ el=document.createElement('div'); el.id='toastBox'; document.body.appendChild(el); }
  el.textContent=msg; el.classList.add('on');
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('on'), ms||2800);
}

/* index the data: ids, lecture numbers, back-references */
const CARDS={}, FMITEMS={};
DATA.subjects.forEach(sub=>{
  let n=0;
  sub.units.forEach((u,ui)=>u.chapters.forEach((ch,ci)=>{
    ch.sub=sub; ch.unit=u;
    ch.lectures.forEach((lec,li)=>{
      n++; lec.no=n; lec.ch=ch; lec.id=lec.id||ch.id+'-l'+li;
      lec.cards.forEach((cd,cdi)=>{ cd.lec=lec; cd.id=lec.id+'-'+cdi; CARDS[cd.id]=cd;
        if(cd.type==='formula') cd.items.forEach((it,i)=>{it.id=cd.id+'-i'+i; FMITEMS[it.id]={it,cd};}); });
    });
  }));
});
const allChapters=sub=>sub.units.flatMap(u=>u.chapters);
const isCustomSub=sub=>(state.subs||[]).some(s=>s.id===sub.id);
const chQuestions=ch=>ch.lectures.flatMap(l=>l.cards.filter(c=>c.type==='question'));
const chFormulaCards=ch=>ch.lectures.flatMap(l=>l.cards.filter(c=>c.type==='formula'));
const STEPS=[['l','▶ Lecture'],['n','✎ Notes'],['q','? Ques']];
const lecSteps=lec=>{const d=state.done[lec.id]||{}; return STEPS.filter(s=>d[s[0]]).length;};
const chDone=ch=>ch.lectures.filter(l=>lecSteps(l)===3).length;
const chSteps=ch=>ch.lectures.reduce((a,l)=>a+lecSteps(l),0);
const chStepsPct=ch=>{const t=ch.lectures.length*3; return t?Math.round(chSteps(ch)/t*100):0;};
const chQuizKeys=ch=>ch.lectures.flatMap(l=>l.cards.flatMap(cd=>cd.type==='question'?[cd.id]:cd.type==='formula'?cd.items.map(it=>it.id):[]));
function quizStats(keys){
  let r=0,p=0,w=0;
  keys.forEach(k=>{const q=state.quiz[k]; if(!q)return; q.m==='right'?r++:q.m==='partial'?p++:w++;});
  const g=r+p+w;
  return {r,p,w,g,n:keys.length,pct:keys.length?Math.round((r+p*.5)/keys.length*100):0};
}
const weakRow=(sym,cls,label,chName,cd)=>`<div class="revItem"><span class="revMark ${cls}">${sym}</span>
  <span class="revT">${esc(label)}<span style="color:var(--faint)"> · ${esc(chName)}</span></span>
  <button class="revGo" data-cid="${cd.id}">Go →</button></div>`;
const markTag=id=>{const q=state.quiz[id]; if(!q)return '';
  const m={right:'✓ right',partial:'~ close',wrong:'✗ wrong'}[q.m];
  return `<span class="qmark m-${q.m}" title="Last quiz result">${m}</span>`;};

let cur={sub:DATA.subjects[0], ch:null, tab:'notes'};

/* ── topbar subject tabs ── */
function renderSubjTabs(){
  $('#subjTabs').innerHTML=DATA.subjects.map(s=>
    `<button class="subjTab${s===cur.sub?' on':''}" data-sid="${s.id}">${esc(s.code)}</button>`).join('')
    +`<button class="subjTab" id="addSub" title="Add a subject">＋</button>`;
  $('#addSub').onclick=()=>{
    const name=(prompt('Subject name?')||'').trim(); if(!name)return;
    if(DATA.subjects.some(d=>d.name.toLowerCase()===name.toLowerCase()))return alert('That subject already exists.');
    let code=(prompt('Short code for the tab? (e.g. FM)')||'').trim().toUpperCase()||name.slice(0,5).toUpperCase();
    const s={id:'cs-'+Date.now(), code, name};
    (state.subs=state.subs||[]).push(s); save();
    DATA.subjects.push({id:s.id, code:s.code, name:s.name, units:[{name:'Unit 1', chapters:[]}]});
    buildPalIndex(); cur.sub=DATA.subjects[DATA.subjects.length-1];
    openChapter(null,'notes');
  };
  $$('#subjTabs .subjTab').forEach(b=>{ if(b.id==='addSub')return; b.onclick=()=>{
    cur.sub=DATA.subjects.find(s=>s.id===b.dataset.sid);
    openChapter(null,'notes');
  };});
}

/* ── sidebar ── */
function impListHTML(){
  const c=state.content||[]; if(!c.length) return '';
  return '<div style=\"margin-top:9px\">'+c.map(en=>{
    const ch=entryChapter(en)||{};
    return '<div class=\"impChap\"><b>'+esc(ch.name||'Chapter')+'</b><button data-rmch=\"'+esc(ch.id||'')+'\" title=\"Remove this imported chapter\">\u00D7</button></div>';
  }).join('')+'</div>';
}
function renderSidebar(){
  const sub=cur.sub;
  let h=`<button class="chRow${!cur.ch?' on':''}" id="ovRow">
    <span class="t"><span>◈ ${esc(sub.code)} overview</span></span></button>
    <button class="chRow${cur.ch==='weak'?' on':''}" id="weakRow" style="margin-bottom:4px">
    <span class="t"><span style="color:var(--gold)">★ Weak topics</span></span></button>`;
  sub.units.forEach(u=>{
    h+=`<div class="unitLbl">${esc(u.name)}</div>`;
    u.chapters.forEach(ch=>{
      const d=chDone(ch), t=ch.lectures.length, pct=chStepsPct(ch);
      h+=`<button class="chRow${ch===cur.ch?' on':''}" data-cid="${ch.id}">
        <span class="t"><span>${esc(ch.name)}</span><span class="n">${d}/${t}</span></span>
        <span class="chBar"><i class="${pct===100?'full':''}" style="width:${pct}%"></i></span></button>`;
    });
    if(!u.chapters.length) h+=`<div style="padding:6px 10px;font-size:12px;color:var(--faint)">No chapters yet</div>`;
  });
  h+=`<button class="chRow${cur.ch==='settings'?' on':''}" id="setRow" style="margin-top:10px">
    <span class="t"><span style="color:var(--dim)">Settings</span></span></button>
    <input type="file" id="impFile" accept=".json" style="display:none">
    <div id="sideFoot">Send Claude a chapter PDF — import the JSON here.</div>`;
  $('#sidebar').innerHTML=h;
  $$('#sidebar .chRow').forEach(b=>b.onclick=()=>{
    if(b.id==='ovRow'){ openChapter(null,'notes'); }
    else if(b.id==='weakRow'){ openChapter('weak','notes'); }
    else if(b.id==='setRow'){ openChapter('settings','notes'); }
    else openChapter(allChapters(cur.sub).find(c=>c.id===b.dataset.cid),'notes');
    closeSideIfDrawer();
  });
  $('#impFile').onchange=e=>{
    const f=e.target.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      let d; try{ d=JSON.parse(r.result); }catch(err){ toast('That file isn\u2019t valid JSON.'); e.target.value=''; return; }
      /* ── chapter content ── */
      const ents=chapEntries(d); const done=[];
      state.content=state.content||[];
      ents.forEach(en=>{
        let res=null; try{ res=mergeChapterEntry(en); }catch(err){}
        if(!res) return;
        const ix=state.content.findIndex(x=>entryChapId(x)===res.id);
        if(ix>-1) state.content[ix]=en; else state.content.push(en);
        done.push(res);
      });
      /* ── progress / backup ── */
      Object.assign(state.done,d.done||{}); Object.assign(state.stars,d.stars||{}); Object.assign(state.quiz,d.quiz||{}); Object.assign(state.exams,d.exams||{}); Object.assign(state.hl,d.hl||{});
      (d.subs||[]).forEach(s=>{ if(!DATA.subjects.some(x=>x.name.toLowerCase()===s.name.toLowerCase())){ (state.subs=state.subs||[]).push(s); DATA.subjects.push({id:s.id,code:s.code,name:s.name,units:[{name:'Unit 1',chapters:[]}]}); } });
      (d.content||[]).forEach(en=>{ if(!entryChapId(en))return; let res=null; try{ res=mergeChapterEntry(en); }catch(err){}
        if(!res)return; const ix=state.content.findIndex(x=>entryChapId(x)===res.id);
        if(ix>-1) state.content[ix]=en; else state.content.push(en); done.push(res); });
      Object.keys(state.done).forEach(k=>{ if(state.done[k]===true) state.done[k]={l:1,n:1,q:1}; });
      const stored=save();
      e.target.value='';
      if(!stored){ toast('Imported, but this device\u2019s storage is full — export a backup and remove an old chapter.',5000); return; }
      if(done.length){
        const added=done.filter(x=>!x.updated).length, upd=done.length-added;
        const bits=[]; if(added)bits.push(added+' chapter'+(added>1?'s':'')+' added'); if(upd)bits.push(upd+' updated');
        toast(bits.join(' · ')+' \u2014 reloading');
        setTimeout(()=>location.reload(),900);
      } else {
        const touched=['done','stars','quiz','exams','hl','subs'].some(k=>d&&d[k]&&Object.keys(d[k]).length);
        buildPalIndex(); openChapter(cur.ch,cur.tab);
        toast(touched?'Progress restored.':'Nothing in that file to import.');
      }
    };
    r.readAsText(f);
  };
}

/* ── stars & done ── */
function starBtn(id){ return `<button class="starBtn${state.stars[id]?' on':''}" data-star="${id}" title="Mark as weak topic">${state.stars[id]?'★':'☆'}</button>`; }
function bindStars(root){
  root.querySelectorAll('[data-star]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const id=b.dataset.star;
    state.stars[id]=!state.stars[id]; if(!state.stars[id]) delete state.stars[id];
    save(); b.classList.toggle('on',!!state.stars[id]); b.textContent=state.stars[id]?'★':'☆';
  });
}

/* ── highlights ────────────────────────────────────────────────────
   Each highlight is {t:text, c:colour, n:which occurrence}. They're
   applied to the rendered DOM after every render, so any card type
   can carry them — a note, a formula row, a question or its answer. */
const HL_COLORS=['y','g','b','p','o','r'];
function flattenText(scope){
  const nodes=[]; let flat='';
  const w=document.createTreeWalker(scope,NodeFilter.SHOW_TEXT,null);
  let n; while((n=w.nextNode())){
    if(!n.nodeValue) continue;
    nodes.push({node:n,start:flat.length}); flat+=n.nodeValue;
  }
  return {nodes,flat};
}
function hlNormalize(id){
  const raw=state.hl[id]; if(!raw) return [];
  let changed=false;
  const out=raw.map(x=>{
    if(typeof x==='string'){ changed=true; return {t:x,c:'y',n:0}; }
    if(x&&x.t!=null){ if(x.c==null){x.c='y';changed=true;} if(x.n==null){x.n=0;changed=true;} return x; }
    changed=true; return null;
  }).filter(Boolean);
  if(changed) state.hl[id]=out;
  return out;
}
/* wrap the nth occurrence of `text` inside `scope` */
function wrapNth(scope,text,colour,nth){
  if(!text) return false;
  const {nodes,flat}=flattenText(scope);
  let from=-1, seen=0, at=flat.indexOf(text);
  while(at>-1){ if(seen===nth){ from=at; break; } seen++; at=flat.indexOf(text,at+1); }
  if(from<0){ from=flat.indexOf(text); if(from<0) return false; }   /* fall back to the first */
  const end=from+text.length;
  const pieces=[];
  nodes.forEach(it=>{
    const s0=it.start, e0=s0+it.node.nodeValue.length;
    if(e0<=from||s0>=end) return;
    if(it.node.parentElement&&it.node.parentElement.closest('mark.hlm')) return;  /* already marked */
    pieces.push({node:it.node,from:Math.max(0,from-s0),to:Math.min(it.node.nodeValue.length,end-s0)});
  });
  let done=false;
  pieces.reverse().forEach(p=>{
    if(p.to<=p.from) return;
    try{
      const r=document.createRange();
      r.setStart(p.node,p.from); r.setEnd(p.node,p.to);
      const m=document.createElement('mark');
      m.className='hlm'; m.dataset.hc=colour||'y'; m.title='Tap to remove this highlight';
      r.surroundContents(m); done=true;
    }catch(e){}
  });
  return done;
}
function applyHighlights(root){
  root.querySelectorAll('[data-cid]').forEach(card=>{
    const list=hlNormalize(card.dataset.cid);
    if(!list.length) return;
    list.forEach(h=>{
      wrapNth(card,h.t,h.c,h.n||0);
      card.querySelectorAll('mark.hlm:not([data-hlt])').forEach(mk=>{
        mk.dataset.hlc=card.dataset.cid; mk.dataset.hlt=h.t; mk.dataset.hln=String(h.n||0);
      });
    });
  });
}
/* ── card renderers ── */
function noteCard(cd){
  return `<div class="card" data-cid="${cd.id}"><div class="cardTop"><div class="cardTitle">${esc(cd.title)}</div>${starBtn(cd.id)}</div><div class="cardBody">${cd.html}</div></div>`;
}
function formulaCard(cd){
  const rows=cd.items.map(it=>`<div class="fmRow"><div class="fmLbl">${esc(it.l)}</div><div class="fmVal">${esc(it.f)}</div><div class="fmNote">${markTag(it.id)||esc(it.n||'')}</div></div>`).join('');
  return `<div class="card fmCard" data-cid="${cd.id}"><div class="cardTop"><div class="cardTitle">${esc(cd.title)}</div>${starBtn(cd.id)}</div>${rows}</div>`;
}
function questionCard(cd,i){
  const tags=[markTag(cd.id),...(cd.src?[`<span class="qTag src">${esc(cd.src)}</span>`]:[]),
              ...(cd.tags||[]).map(t=>`<span class="qTag">${esc(t)}</span>`),
              `<span class="qTag">Lec ${cd.lec.no}</span>`].join('');
  return `<div class="qCard" data-cid="${cd.id}">
    <button class="qHead"><span class="qNum">Q${i+1}</span>
      <span class="qText">${esc(cd.q)}<span class="qTags">${tags}</span></span>
      ${starBtn(cd.id)}<span class="qChev">▶</span></button>
    <div class="qAns"><div class="qAnsInner">${cd.a}</div></div></div>`;
}

/* ── chapter view ── */
function openChapter(ch,tab,noSave){
  cur.ch=ch; cur.tab=tab||'notes';
  if(!noSave){ state.view=(ch&&ch.id)?{sub:cur.sub.id,ch:ch.id,tab:cur.tab}:null; save(); }
  renderSubjTabs(); renderSidebar(); renderMain();
}
function settingsHTML(){
  const chapters=(state.content||[]).map(en=>{
    const c=entryChapter(en)||{};
    return `<div class="setLine"><span>${esc(c.name||'Chapter')}</span>
      <button class="setMini danger" data-rmch="${esc(c.id||'')}">Remove</button></div>`;
  }).join('') || `<div class="setNote">Nothing imported yet.</div>`;
  const subs=DATA.subjects.map(sb=>`<div class="setLine"><span>${esc(sb.name)}</span>
    <span class="setNote" style="margin:0">${allChapters(sb).length} ch.</span></div>`).join('');
  return `<div class="crumb"><b>SEMESTER V</b></div><h1 class="chTitle">Settings</h1>

    <div class="setBlk"><div class="setupLbl">Appearance</div>
      <div class="setLine"><span>Theme<em>Auto follows your phone's light/dark setting.</em></span>
        <span class="setSeg">
          <button data-th="auto" class="${state.theme==='auto'?'on':''}">Auto</button>
          <button data-th="light" class="${state.theme==='light'?'on':''}">Light</button>
          <button data-th="dark" class="${state.theme==='dark'?'on':''}">Dark</button>
        </span></div></div>

    <div class="setBlk"><div class="setupLbl">Chapters</div>${chapters}</div>

    <div class="setBlk"><div class="setupLbl">Subjects</div>${subs}</div>

    <div class="setBlk"><div class="setupLbl">Your work</div>
      <div class="setLine"><span>Export a backup<em>Notes, chapters and progress in one file.</em></span>
        <button class="setMini" id="expBtn">Export</button></div>
      <div class="setLine"><span>Import<em>A chapter from Claude, or a backup.</em></span>
        <button class="setMini" id="impBtn">Import</button></div>
      <div class="setLine"><span>Load demo chapter<em>See how an imported chapter looks.</em></span>

let _pwSeen=null;
function renderStack(){
  const host=$('#pwStack'); if(!host) return;
  const total=DATA.subjects.reduce((n,sb)=>n+allChapters(sb).length,0);
  const shown=Math.min(total,15);
  const sheets=host.querySelector('.pwSheets'), weight=host.querySelector('.pwWeight');
  const grew=_pwSeen!==null&&total>_pwSeen;
  if(sheets.children.length!==shown){
    sheets.innerHTML='';
    for(let i=0;i<shown;i++){
      const el=document.createElement('i');
      const w=30+((i*7)%13);                       /* a slightly ragged stack */
      el.style.width=w+'px';
      el.style.marginLeft=(((i*5)%7)-3)+'px';
      el.style.bottom=(i*3.6)+'px';
      if(grew&&i===shown-1) el.classList.add('fresh');
      sheets.appendChild(el);
    }
  }
  weight.style.bottom=(shown*3.6+2)+'px';
  if(grew){ weight.classList.remove('thud'); void weight.offsetWidth; weight.classList.add('thud'); }
  host.title=total+(total===1?' chapter':' chapters')+' under the weight';
  _pwSeen=total;
}

    if(el){ el.scrollIntoView({block:'center'}); if(cd.type==='question') el.classList.add('open');
      el.classList.add('hl'); setTimeout(()=>el.classList.remove('hl'),1800); }
  });

/* ── command palette ── */
let palIndex=[], palSel=0, palHits=[];
function buildPalIndex(){
  palIndex=[];
  DATA.subjects.forEach(sub=>allChapters(sub).forEach(ch=>ch.lectures.forEach(lec=>{
    palIndex.push({k:'lec',t:lec.title,p:`${sub.code} · ${ch.name} · Lec ${lec.no}`,go:()=>{cur.sub=sub;openChapter(ch,'notes');requestAnimationFrame(()=>{const el=document.querySelector(`[data-cid="${lec.id}"]`);if(el){el.scrollIntoView({block:'start'});el.classList.add('hl');setTimeout(()=>el.classList.remove('hl'),1800);}});}});
    lec.cards.forEach(cd=>{
      if(cd.type==='note') palIndex.push({k:'note',t:cd.title,p:`${sub.code} · ${ch.name}`,go:()=>jumpTo(cd)});
      if(cd.type==='question') palIndex.push({k:'q',t:cd.q,p:`${sub.code} · ${ch.name}`,go:()=>jumpTo(cd)});
      if(cd.type==='formula') cd.items.forEach(it=>palIndex.push({k:'fm',t:it.l+'  '+it.f,p:`${sub.code} · ${ch.name}`,go:()=>jumpTo(cd)}));
    });
  })));
}
function palRender(){
  const q=$('#palInput').value.trim().toLowerCase();
  palHits=q?palIndex.filter(e=>(e.t+' '+e.p).toLowerCase().includes(q)).slice(0,12):palIndex.slice(0,12);
  palSel=Math.min(palSel,Math.max(0,palHits.length-1));
  $('#palResults').innerHTML=palHits.map((e,i)=>
    `<button class="palItem${i===palSel?' sel':''}" data-i="${i}">
      <span class="palKind k-${e.k}">${{lec:'Lec',note:'Note',q:'Ques',fm:'Form'}[e.k]}</span>
      <span class="palT">${esc(e.t)}</span><span class="palPath">${esc(e.p)}</span></button>`).join('')
    ||`<div class="empty" style="padding:24px">No matches</div>`;
  $$('#palResults .palItem').forEach(b=>b.onclick=()=>{palGo(palHits[+b.dataset.i]);});
}
function palGo(e){ if(!e)return; palToggle(false); e.go(); }
function palToggle(show){
  $('#palWrap').classList.toggle('show',show);
  if(show){ $('#palInput').value=''; palSel=0; palRender(); setTimeout(()=>$('#palInput').focus(),10); }

/* ── quiz ── */
let qz=null;
function quizPool(mode,subId,chId,starred){
  let subs=subId==='all'?DATA.subjects:DATA.subjects.filter(s=>s.id===subId);
  let pool=[];
  subs.forEach(sub=>allChapters(sub).forEach(ch=>{
    if(chId!=='all'&&ch.id!==chId)return;
    ch.lectures.forEach(lec=>lec.cards.forEach(cd=>{
      if(mode==='formulas'&&cd.type==='formula'&&(!starred||state.stars[cd.id]))
        cd.items.forEach(it=>pool.push({prompt:`${it.l}${it.n?' — '+it.n:''}`,ans:`<span class="fmVal">${esc(it.f)}</span>`,scope:`${sub.code} · ${ch.name} · ${cd.title}`,cd,key:it.id}));
      if(mode==='questions'&&cd.type==='question'&&(!starred||state.stars[cd.id]))
        pool.push({prompt:cd.q,ans:cd.a,scope:`${sub.code} · ${ch.name}${cd.src?' · '+cd.src:''}`,cd,key:cd.id});
    }));
  }));
  return pool;
}
function quizSetup(){
  qz={mode:'formulas',sub:'all',ch:'all',starred:false,smart:false};
  $('#quizWrap').classList.add('show'); document.body.style.overflow='hidden';
  drawSetup();
}
function drawSetup(){
  const subs=[{id:'all',code:'All subjects'},...DATA.subjects];
  const chs=qz.sub==='all'?[]:allChapters(DATA.subjects.find(s=>s.id===qz.sub));
  const n=quizPool(qz.mode,qz.sub,qz.ch,qz.starred).length;
  $('#quizInner').innerHTML=`
    <div class="quizEyebrow">Quiz mode</div><div class="quizH">Build your round</div>
    <div class="setupSec"><div class="setupLbl">What</div><div class="pillRow">
      <button class="pill${qz.mode==='formulas'?' on':''}" data-m="formulas">Formulas</button>
      <button class="pill${qz.mode==='questions'?' on':''}" data-m="questions">Questions</button></div></div>
    <div class="setupSec"><div class="setupLbl">Subject</div><div class="pillRow">
      ${subs.map(s=>`<button class="pill${qz.sub===s.id?' on':''}" data-s="${s.id}">${esc(s.code)}</button>`).join('')}</div></div>
    ${chs.length?`<div class="setupSec"><div class="setupLbl">Chapter</div><div class="pillRow">
      <button class="pill${qz.ch==='all'?' on':''}" data-c="all">All chapters</button>
      ${chs.map(c=>`<button class="pill${qz.ch===c.id?' on':''}" data-c="${c.id}">${esc(c.name)}</button>`).join('')}</div></div>`:''}
    <div class="setupSec"><div class="setupLbl">Filter</div><div class="pillRow">
      <button class="pill gold${qz.starred?' on':''}" data-star="1">★ Starred only</button>
      <button class="pill gold${qz.smart?' on':''}" data-smart="1" title="Prioritises wrong, close, stale and never-tried cards; capped at 20">◎ Smart round</button></div></div>
    <button id="quizStart" ${n?'':'disabled'}>Start — ${qz.smart?Math.min(20,n)+' smart-picked of '+n:n} card${n===1?'':'s'}</button>`;
  $$('#quizInner [data-m]').forEach(b=>b.onclick=()=>{qz.mode=b.dataset.m;drawSetup();});
  $$('#quizInner [data-s]').forEach(b=>b.onclick=()=>{qz.sub=b.dataset.s;qz.ch='all';drawSetup();});
  $$('#quizInner [data-c]').forEach(b=>b.onclick=()=>{qz.ch=b.dataset.c;drawSetup();});
  const st=$('#quizInner [data-star]'); if(st)st.onclick=()=>{qz.starred=!qz.starred;drawSetup();};
  const sm=$('#quizInner [data-smart]'); if(sm)sm.onclick=()=>{qz.smart=!qz.smart;drawSetup();};
  $('#quizStart').onclick=()=>{
    let pool=quizPool(qz.mode,qz.sub,qz.ch,qz.starred);
    if(qz.smart){
      const wt=c=>{const q=state.quiz[c.key]; if(!q)return 3;
        const age=(Date.now()-q.t)/864e5;
        if(q.m==='wrong')return 5; if(q.m==='partial')return 4+(age>3?1:0);
        return age>7?2:0.5;};
      pool=pool.map(c=>({c,k:Math.random()*wt(c)})).sort((a,b)=>b.k-a.k).slice(0,20).map(x=>x.c);
    } else pool.sort(()=>Math.random()-.5);
    qz.pool=pool; qz.i=0; qz.res=[]; drawCard();
  };
}
function drawCard(){
  if(qz.i>=qz.pool.length)return drawEnd();
  const c=qz.pool[qz.i];
  $('#quizInner').innerHTML=`
    <div id="qzProgBar"><i style="width:${qz.i/qz.pool.length*100}%"></i></div>
    <div class="qzCount">${qz.i+1} / ${qz.pool.length}</div>
    <div class="qzScope">${esc(c.scope)}</div>
    <div class="qzPrompt">${esc(c.prompt)}</div>
    <div id="qzAns"></div>
    <div class="qzBtns" id="qzB1">
      <button class="qzBtn reveal" data-k="reveal">Reveal answer <kbd style="opacity:.6;font-size:11px">space</kbd></button>
      <button class="qzBtn" data-k="skip">Skip</button></div>`;
  const reveal=(skipped)=>{
    $('#qzAns').innerHTML=`<div class="qzAnsBox">${c.ans}</div>`;
    $('#qzB1').innerHTML=skipped?`<button class="qzBtn reveal" data-k="next">Next</button>`
      :`<button class="qzBtn right" data-k="right">Right · 1</button>
        <button class="qzBtn partial" data-k="partial">Partial · 2</button>
        <button class="qzBtn wrong" data-k="wrong">Wrong · 3</button>`;
    bindQz(c,skipped);
  };
  qz.onKey=k=>{
    if(k===' '&&!$('#qzAns').innerHTML)reveal(false);
    if($('#qzAns').innerHTML){ if(k==='1')grade(c,'right'); if(k==='2')grade(c,'partial'); if(k==='3')grade(c,'wrong'); }
  };
  $$('#qzB1 [data-k]').forEach(b=>b.onclick=()=>{ b.dataset.k==='reveal'?reveal(false):(qz.res.push({c,mark:'skip'}),reveal(true)); });
  function bindQz(c,skipped){
    $$('#qzB1 [data-k]').forEach(b=>b.onclick=()=>{
      if(b.dataset.k==='next'){qz.i++;drawCard();} else grade(c,b.dataset.k);
    });
  }
}
function grade(c,mark){

/* ── Highlighter ───────────────────────────────────────────────────
   Off by default. Turn it on, pick a colour, then draw across text —
   only the WORDS the stroke actually passes over get marked, the way
   underlining a page works. No block selection, no rectangles.      */
function applyHlMode(){
  document.body.classList.toggle('hlmode',!!state.hlmode);
  const b=$('#hlBtn'); if(b) b.setAttribute('aria-pressed',state.hlmode?'true':'false');
  document.documentElement.style.setProperty('--hcc-active','var(--hc-'+(state.hlColor||'y')+')');

/* Every word in a card, with where it actually sits on screen.
   Built once when a stroke starts — no caret guessing involved.     */
function buildWordIndex(card){
  const words=[];
  const w=document.createTreeWalker(card,NodeFilter.SHOW_TEXT,null);
  let n;
  while((n=w.nextNode())){
    const s=n.nodeValue||'';
    if(!s.trim()) continue;
    const host=n.parentElement; if(!host) continue;
    if(host.closest('mark.hlm')) continue;                               /* already marked */
    if(host.closest('.starBtn,.qChev,.qNum,.stepBtn,.lecNum,.ct,.revGo')) continue;  /* controls, not prose */
    const re=/\S+/g; let m;
    while((m=re.exec(s))){
      const a=m.index, b=a+m[0].length;
      let rects=[];
      try{
        const r=document.createRange(); r.setStart(n,a); r.setEnd(n,b);
        rects=Array.prototype.slice.call(r.getClientRects());
      }catch(e){}
      if(rects.length) words.push({node:n,a,b,rects});
    }
  }
  return words;
}
/* Which word does a point touch? Exactly one — the nearest line.
   A stroke drawn just under a line belongs to THAT line, not the one
   below it, so the word above the pencil wins ties.                 */
function hitAt(x,y){
  if(!hlStroke||!hlStroke.words) return;
  const W=hlStroke.words;
  let best=-1, bestScore=Infinity;
  for(let i=0;i<W.length;i++){
    const rs=W[i].rects;
    for(let k=0;k<rs.length;k++){
      const r=rs[k];
      if(!r.height) continue;
      if(x<r.left-1.5||x>r.right+1.5) continue;
      let score;
      if(y>=r.top&&y<=r.bottom) score=0;                       /* drawn through the word */
      else if(y>r.bottom) score=(y-r.bottom)*1.0;              /* underlining it */
      else score=(r.top-y)*1.6;                                /* above — less likely intended */
      if(score>r.height*0.75) continue;
      if(score<bestScore){ bestScore=score; best=i; }
    }
  }
  if(best>-1&&!hlStroke.hits.has(best)){
    hlStroke.hits.add(best);
    ghostAdd(W[best]);                                         /* show it immediately */
  }
}
/* live trail: a snug tint over each word as the pencil reaches it */
function ghostAdd(wd){
  const host=document.getElementById('hlGhost'); if(!host) return;
  wd.rects.forEach(r=>{
    const el=document.createElement('i');
    el.style.left=r.left+'px'; el.style.top=r.top+'px';
    el.style.width=Math.max(1,r.right-r.left)+'px';
    el.style.height=Math.max(1,r.bottom-r.top)+'px';
    host.appendChild(el);
  });
}
function ghostClear(){ const h=document.getElementById('hlGhost'); if(h) h.innerHTML=''; }

/* turn a text range into a mark, in place — no re-render */
function markRange(node,a,b,colour,text,nth,cardId){
  try{
    const r=document.createRange();
    r.setStart(node,a); r.setEnd(node,b);
    const m=document.createElement('mark');
    m.className='hlm'; m.dataset.hc=colour||'y';
    m.dataset.hlc=cardId; m.dataset.hlt=text; m.dataset.hln=String(nth||0);
    m.title='Tap to remove this highlight';
    r.surroundContents(m);
    bindMark(m);
    return m;
  }catch(e){ return null; }
}
function bindMark(mk){
  const kill=e=>{
    if(e){ e.stopPropagation(); if(e.preventDefault) e.preventDefault(); }
    const id=mk.dataset.hlc, t=mk.dataset.hlt, nth=+(mk.dataset.hln||0);
    const arr=state.hl[id]||[];
    let ix=arr.findIndex(h=>h&&h.t===t&&(h.n||0)===nth);
    if(ix<0) ix=arr.findIndex(h=>h&&h.t===t);
    if(ix<0) ix=arr.indexOf(t);
    if(ix>-1) arr.splice(ix,1);
    if(!arr.length) delete state.hl[id];
    /* unwrap in place — no re-render, no scroll jump */
    const parent=mk.parentNode;
    if(parent){
      while(mk.firstChild) parent.insertBefore(mk.firstChild,mk);
      parent.removeChild(mk);
      parent.normalize();
    }
    save();
  };
  mk.onclick=kill;
  mk.onpointerup=e=>{ if(!hlStroke||!hlStroke.moved) kill(e); };
}
function strokeCommit(){
  if(!hlStroke||!hlStroke.card||!hlStroke.hits.size) return false;
  const card=hlStroke.card, id=card.dataset.cid, W=hlStroke.words;
  const {nodes,flat}=flattenText(card);
  const pos=new Map(nodes.map(it=>[it.node,it.start]));
  /* group the words hit by text node, then merge neighbours into runs */
  const byNode=new Map();
  [...hlStroke.hits].forEach(i=>{
    const wd=W[i];
    if(!byNode.has(wd.node)) byNode.set(wd.node,[]);
    byNode.get(wd.node).push(wd);
  });
  const runs=[];
  byNode.forEach((ws,node)=>{
    const base=pos.get(node); if(base==null) return;
    const val=node.nodeValue||'';
    ws.sort((p,q)=>p.a-q.a);
    let cur=null;
    ws.forEach(wd=>{
      if(cur && /^\s*$/.test(val.slice(cur.b,wd.a))) cur.b=Math.max(cur.b,wd.b);
      else { if(cur) runs.push(cur); cur={a:wd.a,b:wd.b,node,base}; }
    });
    if(cur) runs.push(cur);
  });
  const list=hlNormalize(id); state.hl[id]=list;
  /* wrap back-to-front within each node so earlier offsets stay valid */
  runs.sort((p,q)=> p.node===q.node ? q.a-p.a : 0);
  let added=0;
  runs.forEach(r=>{
    const text=(r.node.nodeValue||'').slice(r.a,r.b).replace(/\s+$/,'');
    if(!text) return;
    const abs=r.base+r.a;
    let seen=0, at=flat.indexOf(text);
    while(at>-1 && at<abs){ seen++; at=flat.indexOf(text,at+1); }
    if(list.some(h=>h.t===text && (h.n||0)===seen)) return;
    if(markRange(r.node,r.a,r.a+text.length,state.hlColor||'y',text,seen,id)){
      list.push({t:text,c:state.hlColor||'y',n:seen});
      added++;
    }
  });
  if(!added) return false;
  save();
  return true;
}
let hlStroke=null;
document.addEventListener('pointerdown',e=>{
  hlStroke=null;
  if(!state.hlmode) return;
  if(e.target.closest&&e.target.closest('mark.hlm')) return;   /* tapping a highlight removes it */
  const card=e.target.closest&&e.target.closest('#main [data-cid]');
  if(!card) return;
  hlStroke={card,words:buildWordIndex(card),hits:new Set(),moved:false,x:e.clientX,y:e.clientY,last:null};
  hitAt(e.clientX,e.clientY);
},true);
document.addEventListener('pointermove',e=>{
  if(!hlStroke) return;
  if(!hlStroke.moved && Math.hypot(e.clientX-hlStroke.x,e.clientY-hlStroke.y)>4) hlStroke.moved=true;
  const p=hlStroke.last;
  if(p){                                    /* sample along the path so fast strokes don't skip words */
    const d=Math.hypot(e.clientX-p.x,e.clientY-p.y);
    const steps=Math.min(20,Math.max(1,Math.round(d/6)));
    for(let i=1;i<=steps;i++) hitAt(p.x+(e.clientX-p.x)*i/steps, p.y+(e.clientY-p.y)*i/steps);
  } else hitAt(e.clientX,e.clientY);
  hlStroke.last={x:e.clientX,y:e.clientY};
  if(hlStroke.moved&&e.cancelable) e.preventDefault();
},true);
document.addEventListener('pointerup',e=>{
  if(!hlStroke) return;
  if(hlStroke.moved) hitAt(e.clientX,e.clientY);
  const ok=hlStroke.moved ? strokeCommit() : false;
  hlStroke=null; ghostClear();
},true);
document.addEventListener('pointercancel',()=>{hlStroke=null;ghostClear();},true);
window.addEventListener('scroll',()=>{ if(hlStroke){ hlStroke=null; ghostClear(); } },true);

    const s=GUIDE[i];
    $('#gBody').innerHTML='<span class="gEmoji">'+s.e+'</span>'+
      '<div class="gTitle">'+s.t+'</div><div class="gText">'+s.h+'</div>'+
      (s.k?'<div class="gKey">'+s.k+'</div>':'');
    $('#gTrack').innerHTML='<i style="width:'+Math.round((i+1)/GUIDE.length*100)+'%"></i>';
    $$('#gDots i').forEach((d,n)=>d.classList.toggle('on',n===i));
    $('#gNext').textContent = i===GUIDE.length-1 ? 'Start' : 'Next';
    $('#gSkip').style.visibility = i===GUIDE.length-1 ? 'hidden' : 'visible';
  }
  function done(){ try{ localStorage.setItem('pw-guide-seen',GUIDE_VERSION); localStorage.setItem('pw-seen-version',APP_VERSION); }catch(e){} g.setAttribute('hidden',''); }
  g.removeAttribute('hidden'); paint();
  $('#gNext').onclick=()=>{ if(i<GUIDE.length-1){ i++; paint(); } else done(); };
  $('#gSkip').onclick=done;
}

/* ── boot: restore last view ── */
buildPalIndex();
(function(){
  let ch=null;
  if(state.view){
    const s=DATA.subjects.find(s=>s.id===state.view.sub);
    if(s){ cur.sub=s; ch=allChapters(s).find(c=>c.id===state.view.ch)||null; }
  }
  if(!ch) ch=allChapters(cur.sub)[0]||null;
  openChapter(ch,(state.view&&state.view.tab)||'notes',true);
  showGuide(false); showWhatsNew();
})();
</script>
